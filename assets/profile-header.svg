<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Aakhyan — full-stack developer</title>
  <desc id="description">EvolutionX-10. A midnight-blue banner with a connected grid of teal and violet nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset="1" stop-color="#141D32" />
    </linearGradient>
    <linearGradient id="accent" x1="566" y1="52" x2="890" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC" />
      <stop offset="1" stop-color="#5EEAD4" />
