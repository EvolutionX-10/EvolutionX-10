  <text x="46" y="151" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Aakhyan</text>
  <text x="50" y="199" fill="#94A3B8" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="16" letter-spacing="3">EVOLUTIONX-10</text>

